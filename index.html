<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>EV Tech Solutions</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
</head>

<body><canvas id="bg"></canvas>
    <header>
        <h1>EV Tech Solutions</h1>
        <nav><a href='#'>Home</a><a href='#services'>Services</a><a href='#booking'>Booking</a></nav>
    </header>
    <section class='hero'>
        <div>
            <h2>Future Ready EV Repairs</h2>
            <p>Battery, BMS, VCU and EV Diagnostics</p><button>Book Service</button>
        </div>
        <div id='hero3d'></div>
    </section>
    <section id='services'>
        <h2>Services</h2>
        <div class='grid'>
            <div class='card'><img src='https://images.unsplash.com/photo-1603539947678-cd3954ed515d?w=800'
                    loading='lazy'>
                <h3>Battery Repair</h3>
            </div>
            <div class='card'><img src='https://images.unsplash.com/photo-1518770660439-4636190af475?w=800'
                    loading='lazy'>
                <h3>BMS Repair</h3>
            </div>
            <div class='card'><img src='https://images.unsplash.com/photo-1581092921461-eab62e97a780?w=800'
                    loading='lazy'>
                <h3>VCU Repair</h3>
            </div>
        </div>
    </section>
    <section>
        <h2>Vehicle Carousel</h2>
        <div class='carousel'><button id='prev'>&lt;</button>
            <div id='vehicle'>Ola S1 Pro</div><button id='next'>&gt;</button>
        </div>
    </section>
    <section id='booking'>
        <h2>Book Service</h2>
        <form class='glass'><input placeholder='Name'><input placeholder='Phone'><input
                placeholder='Vehicle'><button>Submit</button></form>
    </section>
    <script type='module' src='script.js'></script>
</body>

</html>
